name: Build swisstopo APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_VERSION: swisstopo-${{ github.run_number }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Build debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk routegraph-swisstopo.apk
    - name: Publish release
      uses: ncipollo/release-action@v1
      with:
        tag: swisstopo-${{ github.run_number }}
        commit: ${{ github.sha }}
        name: RouteGraph swisstopo build ${{ github.run_number }}
        body: "Sideload on the Karoo: https://github.com/${{ github.repository }}/releases/latest/download/routegraph-swisstopo.apk"
        artifacts: routegraph-swisstopo.apk
        makeLatest: true
